<html lang="tr">

<meta name="description" content="Merve Kırmızıgül yaratıcı yönetim, stratejik iletişim ve AI reklamcılık portföyü.">

<style>
:root{
  --bg:#121718;
  --panel:#263132;
  --lime:#C3E561;
  --white:#EFF1E9;
  --muted:#A9B6B0;
  --line:#37443F;
}

*{box-sizing:border-box}

html{scroll-behavior:smooth}

body{
  margin:0;
  background:var(--bg);
  color:var(--white);
  font-family:Inter,Arial,sans-serif;
}

a{text-decoration:none;color:inherit}
button{font:inherit;cursor:pointer}

h1,h2,h3{
  font-family:Sora,Arial,sans-serif;
  letter-spacing:-.045em;
}

.container{
  width:min(1200px,calc(100% - 40px));
  margin:auto;
}

/* MENÜ */

header{
  position:sticky;
  top:0;
  z-index:20;
  background:#121718f2;
  backdrop-filter:blur(18px);
  border-bottom:1px solid var(--line);
}

.nav{
  min-height:76px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:20px;
}

.logo{
  font-family:Sora,sans-serif;
  font-weight:800;
  letter-spacing:-.05em;
  font-size:17px;
}

.logo span{color:var(--lime)}

.nav-links{
  display:flex;
  gap:24px;
  font-size:12px;
  color:#C7D0CA;
}

.nav-links a:hover{color:var(--lime)}

/* GENEL */

.eyebrow{
  color:var(--lime);
  font-size:11px;
  font-weight:700;
  letter-spacing:.11em;
}

.section{
  padding:85px 0;
  border-top:1px solid var(--line);
}

.section h2{
  font-size:clamp(34px,4.5vw,58px);
  margin:15px 0 35px;
}

.muted{
  color:var(--muted);
  line-height:1.8;
}

/* HERO */

.hero{
  min-height:625px;
  position:relative;
  overflow:hidden;
  display:flex;
  align-items:center;
  border-bottom:1px solid var(--line);
  background:
    radial-gradient(circle at 85% 33%,#556e382d,transparent 35%),
    linear-gradient(135deg,#192321,#121718 70%);
}

.hero:after{
  content:"";
  position:absolute;
  width:560px;
  height:560px;
  right:-130px;
  top:12%;
  border:1px solid #C3E56145;
  border-radius:50%;
  box-shadow:0 0 0 100px #C3E56108,
             0 0 0 200px #C3E56105;
  pointer-events:none;
}

.hero-content{
  position:relative;
  z-index:2;
  padding:100px 0;
}

.hero h1{
  font-size:clamp(45px,7vw,90px);
  line-height:1.1;
  margin:24px 0;
  max-width:1000px;
}

.hero h1 span{color:var(--lime)}

.hero p{
  max-width:610px;
  color:#C4CEC7;
  line-height:1.9;
  font-size:16px;
}

.btn{
  display:inline-block;
  margin-top:25px;
  padding:16px 23px;
  background:var(--lime);
  color:#121718;
  font-size:13px;
  font-weight:700;
  border:1px solid var(--lime);
  border-radius:5px;
  transition:.2s;
}

.btn:hover{
  background:transparent;
  color:var(--lime);
}

/* KATEGORİ FİLTRELERİ */

.filters{
  display:flex;
  gap:10px;
  overflow-x:auto;
  padding:5px 0 22px;
  margin-bottom:16px;
  scrollbar-width:thin;
}

.filter{
  flex:none;
  border:1px solid #47564F;
  border-radius:100px;
  padding:12px 17px;
  background:var(--panel);
  color:var(--white);
  white-space:nowrap;
  font-size:12px;
}

.filter.active,
.filter:hover{
  background:var(--lime);
  border-color:var(--lime);
  color:#121718;
}

/* PROJE KARTLARI */

.projects{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:42px 28px;
}

.card{
  display:block;
  min-width:0;
}

.cover{
  width:100%;
  aspect-ratio:16/10;
  position:relative;
  overflow:hidden;
  background:
    radial-gradient(circle at 75% 30%,var(--accent-soft),transparent 38%),
    linear-gradient(135deg,#2a3835,#121919 75%);
  border:1px solid #405049;
}

.cover:before{
  content:"";
  position:absolute;
  border:1px solid var(--accent);
  width:70%;
  aspect-ratio:1;
  right:-25%;
  top:-35%;
  border-radius:50%;
  opacity:.45;
}

.cover:after{
  content:"";
  position:absolute;
  background:linear-gradient(90deg,transparent,#ffffff10,transparent);
  width:40%;
  height:150%;
  left:35%;
  top:-25%;
  transform:rotate(28deg);
}

.cover img{
  display:block;
  width:100%;
  height:100%;
  object-fit:cover;
  position:absolute;
  inset:0;
  z-index:2;
}

.cover-label{
  position:absolute;
  top:9%;
  left:8%;
  font-size:11px;
  letter-spacing:.1em;
  color:var(--accent);
  z-index:1;
}

.cover-word{
  position:absolute;
  bottom:12%;
  left:8%;
  right:8%;
  font-family:Sora,sans-serif;
  font-size:clamp(27px,3.2vw,47px);
  font-weight:800;
  letter-spacing:-.06em;
  z-index:1;
  overflow-wrap:anywhere;
}

.card:hover .cover{
  border-color:var(--lime);
}

.card-category{
  color:var(--lime);
  margin-top:19px;
  font-size:12px;
}

.card h3{
  font-size:25px;
  margin:10px 0;
}

.card-sub{
  color:var(--muted);
  font-size:13px;
  line-height:1.7;
}

.card-more{
  display:inline-block;
  color:var(--lime);
  margin-top:16px;
  font-size:13px;
}

/* ÖNE ÇIKAN TANITIM FİLMİ */

.featured{
  display:grid;
  grid-template-columns:1fr 1.08fr;
  gap:25px;
  align-items:center;
  background:#1C2725;
  border:1px solid #41534A;
  padding:24px;
  margin-bottom:45px;
}

.featured h3{
  font-size:clamp(27px,3.5vw,43px);
  margin:15px 0;
}

.featured p{
  color:#B9C6BE;
  line-height:1.85;
  font-size:14px;
}

.featured .cover{
  aspect-ratio:16/9;
}

/* HİZMETLER */

.service-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:18px;
}

.service{
  padding:32px;
  border:1px solid var(--line);
  background:#1B2524;
}

.service-number{
  color:var(--lime);
  font-size:12px;
}

.service h3{
  font-size:22px;
  margin:15px 0;
}

.service p{
  color:var(--muted);
  font-size:14px;
  line-height:1.8;
}

/* HAKKIMDA */

.about-text{
  max-width:850px;
  color:#C5D0C8;
  line-height:2;
  font-size:16px;
}

/* SSS */

.faq details{
  padding:21px 0;
  border-bottom:1px solid var(--line);
}

.faq summary{
  cursor:pointer;
  font-weight:600;
  font-size:15px;
}

.faq details p{
  color:var(--muted);
  line-height:1.9;
  max-width:790px;
}

/* İLETİŞİM */

.contact h2{
  max-width:850px;
  font-size:clamp(42px,6vw,74px);
}

.contact h2 span{
  color:var(--lime);
}

.detail{
  padding:70px 0 100px;
}

.back{
  color:var(--lime);
  font-size:13px;
}

.detail h1{
  font-size:clamp(42px,6vw,75px);
  margin:25px 0 12px;
}

.detail-sub{
  color:var(--muted);
  font-size:16px;
}

.detail .cover{
  margin:38px 0;
  aspect-ratio:16/8;
}

.detail-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:38px;
  padding:32px 0;
}

.detail-grid h3{
  color:var(--lime);
  font-size:16px;
}

.detail-grid p{
  color:#C3CFC7;
  line-height:1.95;
  font-size:15px;
}

.media-area{
  margin-top:30px;
  background:#1C2725;
  border:1px solid var(--line);
  padding:30px;
}

.media-area video{
  width:100%;
  display:block;
  margin-top:20px;
}

.repo-link{
  display:inline-block;
  color:var(--lime);
  border:1px solid var(--lime);
  padding:14px 20px;
  margin-top:20px;
  font-size:13px;
}

footer{
  border-top:1px solid var(--line);
  padding:30px 0;
  color:var(--muted);
  font-size:12px;
}

@media(max-width:760px){
  .nav{min-height:70px}
  .logo{font-size:14px}
  .nav-links{gap:12px;font-size:11px}
  .hero{min-height:530px}
  .hero-content{padding:70px 0}
  .projects,
  .featured,
  .service-grid,
  .detail-grid{

  .section{padding:60px 0}
  .card h3{font-size:22px}
  .cover-word{font-size:32px}
  .featured{padding:15px}
  .service{padding:24px}
  .detail{padding-top:40px}
  .media-area{padding:20px}
}

@media(max-width:420px){
  .nav-links{gap:9px}
  .nav-links a{font-size:10px}
  .hero h1{font-size:42px}
}
</style>
</head>

function repoLink(p){
  return "https://github.com/" +
    OWNER + "/" + encodeURIComponent(p.repo);
}

/* PROJE KAPAĞI */

function poster(p){
  const image = p.cover
    ? `<img src="${p.cover}" alt="${p.name} kapak görseli">`
    : "";

  const fallback = p.cover
    ? ""
    : `
      <span class="cover-label">Creative Direction / AI Advertising</span>
      <span class="cover-word">${p.visual}</span>
    `;

  return `
    <div class="cover"
      style="--accent:${p.accent};--accent-soft:${p.soft}">
      ${image}
      ${fallback}
    </div>
  `;
}

function projectCard(p){

  return `
    <a class="card" href="?proje=${p.slug}">

      <div class="card-category">${label}</div>

        ${p.subtitle} · AI Advertising
      </div>

      <span class="card-more">
        Projeyi İncele ↗

    </a>

}

  const grid = document.getElementById("projectGrid");

  document.querySelectorAll("[data-category]")
    .forEach(button => {

      button.addEventListener("click",()=>{

        const selected = button.dataset.category;

        document.querySelectorAll("[data-category]")
          .forEach(b=>{
            b.classList.toggle("active",b===button);
          });

        const filtered = selected === "Tüm Projeler"
          ? PROJECTS
          : PROJECTS.filter(
              p => p.category === selected
            );

        grid.innerHTML =
          filtered.map(projectCard).join("");

      });

    });

}

/* HER PROJENİN DETAY GÖRÜNÜMÜ */

function showDetail(p){

  document.title =

  const label = p.category === "Genel Tanıtım"
    ? "Portföy Tanıtımı"
    : p.category;

  app.innerHTML = `

    <main class="container detail">

      <a href="./#projeler" class="back">
        ← Tüm Projelere Dön

      <div class="eyebrow" style="margin-top:35px">
        ${label} / AI Advertising

      <h1>${p.name}</h1>

      <div class="detail-sub">
        ${p.subtitle}
      </div>

      ${poster(p)}

      <div class="detail-grid">

        <div>

          03 / Reklam Filmi ve Görsel Galeri

        ${
          p.video

          : `

}

const params = new URLSearchParams(
